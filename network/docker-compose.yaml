      - CORE_PEER_ID=peer0.sc.example.com
      - CORE_PEER_ADDRESS=peer0.sc.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.sc.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.sc.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.sc.example.com:7051
      - CORE_PEER_LOCALMSPID=OrgSCMSP
