      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.wpi.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.wpi.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.wpi.example.com:7051
      - CORE_PEER_LOCALMSPID=OrgWPIMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/wpi.example.com/peers/peer0.wpi.example.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/wpi.example.com/peers/peer0.wpi.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.wpi.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "8051:7051"
    networks:
      - fabric-poc

  peer0.hdw.example.com:
    container_name: peer0.hdw.example.com
