      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hdw.example.com:7051
      - CORE_PEER_LOCALMSPID=OrgHDWMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hdw.example.com/peers/peer0.hdw.example.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hdw.example.com/peers/peer0.hdw.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.hdw.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "9051:7051"
    networks:
      - fabric-poc

  peer0.sc.example.com:
    container_name: peer0.sc.example.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric-poc
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
