      Writers:
        Type: Signature
        Rule: "OR('OrgWPIMSP.admin', 'OrgWPIMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgWPIMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgWPIMSP.peer')"

  - &OrgHDW
    Name: OrgHDWMSP
    ID: OrgHDWMSP
    MSPDir: crypto-config/peerOrganizations/hdw.example.com/msp
    Policies:
      Readers:
