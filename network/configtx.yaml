---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &OrgIM
    Name: OrgIMMSP
    ID: OrgIMMSP
    MSPDir: crypto-config/peerOrganizations/im.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgIMMSP.admin', 'OrgIMMSP.peer', 'OrgIMMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgIMMSP.admin', 'OrgIMMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgIMMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgIMMSP.peer')"

  - &OrgWPI
    Name: OrgWPIMSP
    ID: OrgWPIMSP
    MSPDir: crypto-config/peerOrganizations/wpi.example.com/msp
    Policies:
