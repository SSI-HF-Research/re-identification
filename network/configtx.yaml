        Rule: "OR('OrgHDWMSP.admin', 'OrgHDWMSP.peer', 'OrgHDWMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgHDWMSP.admin', 'OrgHDWMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgHDWMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgHDWMSP.peer')"

  - &OrgSC
    Name: OrgSCMSP
    ID: OrgSCMSP
    MSPDir: crypto-config/peerOrganizations/sc.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgSCMSP.admin', 'OrgSCMSP.peer', 'OrgSCMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgSCMSP.admin', 'OrgSCMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgSCMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgSCMSP.peer')"

  - &OrgSPI
    Name: OrgSPIMSP
    ID: OrgSPIMSP
    MSPDir: crypto-config/peerOrganizations/spi.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgSPIMSP.admin', 'OrgSPIMSP.peer', 'OrgSPIMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgSPIMSP.admin', 'OrgSPIMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OrgSPIMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgSPIMSP.peer')"

  - &OrgMO
    Name: OrgMOMSP
    ID: OrgMOMSP
    MSPDir: crypto-config/peerOrganizations/mo.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgMOMSP.admin', 'OrgMOMSP.peer', 'OrgMOMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgMOMSP.admin', 'OrgMOMSP.client')"
